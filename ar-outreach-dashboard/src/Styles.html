<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --border: #e3e7ef;
    --text: #1b2333;
    --muted: #667085;
    --primary: #1f4fd8;
    --primary-dark: #173ea9;
    --up: #13804b;
    --down: #c0362c;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.04);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 20px 32px;
  }

  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 16px;
  }
  .subtitle { margin: 0; color: var(--muted); max-width: 820px; }
  .subtitle strong { color: var(--text); font-weight: 600; }
  .header-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }
  .updated { text-align: right; display: flex; flex-direction: column; }
  .updated #lastUpdated { font-weight: 600; }
  .loaded-info { font-size: 12px; }

  /* ---------- buttons & controls ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { border-color: #c5ccd9; }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn-spinner {
    display: none;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .btn.is-busy .btn-spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .link-btn {
    border: 0;
    background: none;
    color: var(--primary);
    font: inherit;
    cursor: pointer;
    padding: 4px 2px;
  }
  .link-btn:hover { text-decoration: underline; }

  .segmented {
    display: inline-flex;
    flex-wrap: wrap;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .segmented button {
    border: 0;
    border-right: 1px solid var(--border);
    background: transparent;
    padding: 6px 12px;
    font: inherit;
    color: var(--text);
    cursor: pointer;
  }
  .segmented button:last-child { border-right: 0; }
  .segmented button:hover { background: #f1f4fa; }
  .segmented button[aria-pressed="true"] { background: var(--primary); color: #fff; }
  .segmented.small button { padding: 4px 10px; font-size: 13px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* ---------- filters ---------- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 28px;
    padding: 14px 16px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .filter-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .date-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
  .date-inputs label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  input[type="date"], select {
    font: inherit;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    background: var(--surface);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px 4px 8px;
    cursor: pointer;
    user-select: none;
    background: var(--surface);
  }
  .chip input { margin: 0; accent-color: var(--primary); }
  .chip .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .chip.is-off { color: var(--muted); background: #f7f8fb; }
  .filter-summary { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13px; }

  /* ---------- banners ---------- */
  .banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    border: 1px solid;
  }
  .banner-error { background: #fdf0ef; border-color: #f3c3be; color: #7a1f17; }
  .banner-info { background: #eef3fd; border-color: #c9d7f6; color: #1d3c86; }

  /* ---------- KPI cards ---------- */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi { padding: 14px 16px; min-height: 104px; display: flex; flex-direction: column; gap: 4px; }
  .kpi-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-value { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 12px; color: var(--muted); }
  .kpi-delta { font-size: 12px; font-weight: 600; }
  .kpi-delta.up { color: var(--up); }
  .kpi-delta.down { color: var(--down); }
  .kpi-delta.flat, .kpi-delta.na { color: var(--muted); }
  .kpi-delta .vs { font-weight: 400; color: var(--muted); }

  /* ---------- panels ---------- */
  .panel { padding: 16px; margin-bottom: 16px; }
  .panel-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .panel-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .chart-box { position: relative; height: 300px; }
  .chart-box-tall { height: 340px; }
  .chart-note {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.92);
  }

  .table-wrap { overflow-x: auto; margin-top: 16px; }
  .data-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .data-table th, .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .data-table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; }
  .data-table .num { text-align: right; }
  .data-table tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--border); }
  .data-table .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab {
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    padding: 8px 14px;
    font: inherit;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }

  /* ---------- sequences ---------- */
  .panel-hint { margin: -4px 0 12px; color: var(--muted); font-size: 13px; max-width: 900px; }
  .panel-hint code { font-size: 12px; }
  .sort-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .sort-btn:hover { color: var(--text); }
  .sort-btn .arrow::after { content: "\2195"; opacity: 0.35; }
  th[aria-sort="ascending"] .sort-btn, th[aria-sort="descending"] .sort-btn { color: var(--text); }
  th[aria-sort="ascending"] .arrow::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .arrow::after { content: "\2193"; opacity: 1; }
  .seq-row { cursor: pointer; }
  .seq-row:hover > td { background: #f7f9fd; }
  .seq-row:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .seq-row.is-manual > td:first-child { font-style: italic; }
  .caret { display: inline-block; width: 1.1em; color: var(--muted); transition: transform 0.15s; }
  .seq-row[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .detail-row > td { background: #f9fafc; padding: 12px 16px 16px; white-space: normal; }
  .detail-grid { display: grid; gap: 14px; }
  .detail-grid h3 {
    font-size: 12px;
    margin: 0 0 6px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .data-table.sub { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .data-table.sub th, .data-table.sub td { padding: 6px 10px; }
  .data-table .label-cell { white-space: normal; min-width: 220px; max-width: 460px; }
  .data-table .row-rollup td { color: var(--muted); font-style: italic; }

  /* ---------- loading ---------- */
  #content.is-loading .kpi-value,
  #content.is-loading .kpi-delta,
  #content.is-loading .kpi-sub {
    color: transparent;
    background: linear-gradient(90deg, #eef1f6 25%, #f7f8fb 50%, #eef1f6 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    border-radius: 6px;
  }
  #content.is-loading .panel { opacity: 0.55; }
  #content.is-refreshing { opacity: 0.6; transition: opacity 0.15s; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .page-footer { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    body { padding: 14px 12px 24px; }
    .page-header { flex-direction: column; gap: 12px; }
    .header-meta { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; }
    .updated { text-align: left; }
    h1 { font-size: 19px; }
    .filter-group > .segmented { display: flex; width: 100%; }
    .filter-group > .segmented button { flex: 1 1 auto; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi-value { font-size: 24px; }
    .chart-box { height: 260px; }
  }
</style>
