<script>
/* Pure aggregation helpers (no DOM). Also loaded by tests/aggregation.test.js. */
var Metrics = (function () {
  'use strict';

  var TIME_ZONE = 'America/Phoenix';
  var REPS = ['Jasmine Bosley', 'Myles Thompson', 'Crystal Belmontes'];
  var DAY_MS = 86400000;
  var MAX_BUCKETS = 3000;
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function toBool(v) {
    if (v === true || v === false) return v;
    if (typeof v === 'number') return v !== 0;
    if (v === null || v === undefined) return false;
    var s = String(v).trim().toLowerCase();
    return s === 'true' || s === 'yes' || s === 'y' || s === '1';
  }

  /* ---------- date keys (YYYY-MM-DD, compared as strings) ---------- */

  function isDateKey(s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  }

  function keyToMs(key) {
    var p = key.split('-');
    return Date.UTC(+p[0], +p[1] - 1, +p[2]);
  }

  function msToKey(ms) {
    return new Date(ms).toISOString().slice(0, 10);
  }

  function addDays(key, n) {
    return msToKey(keyToMs(key) + n * DAY_MS);
  }

  function daysInclusive(start, end) {
    return Math.round((keyToMs(end) - keyToMs(start)) / DAY_MS) + 1;
  }

  function mondayOf(key) {
    var d = new Date(keyToMs(key));
    return msToKey(d.getTime() - ((d.getUTCDay() + 6) % 7) * DAY_MS);
  }

  function addMonths(monthKey, n) {
    var y = +monthKey.slice(0, 4);
    var m = +monthKey.slice(5, 7) - 1 + n;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + (m < 9 ? '0' : '') + (m + 1);
  }

  function todayKey(now) {
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(now || new Date());
    var get = function (t) { return parts.filter(function (p) { return p.type === t; })[0].value; };
    return get('year') + '-' + get('month') + '-' + get('day');
  }

  /* ---------- rows ---------- */

  /** Turns the server payload ({fields, rows: [[...]]}) into normalized row objects. */
  function expandRows(payload) {
    var fields = (payload && payload.fields) || [];
    var raw = (payload && payload.rows) || [];
    var ix = {};
    fields.forEach(function (f, i) { ix[f] = i; });
    var pick = function (r, name) { return Array.isArray(r) ? r[ix[name]] : r[name]; };

    var text = function (r, name) {
      var v = pick(r, name);
      return v === null || v === undefined ? '' : String(v).trim();
    };

    var out = [];
    raw.forEach(function (r) {
      var date = String(pick(r, 'date') || '').trim();
      var channel = String(pick(r, 'channel') || '').trim().toLowerCase();
      if (!isDateKey(date) || (channel !== 'email' && channel !== 'sms')) return;
      var week = String(pick(r, 'week_start') || '').trim();
      var month = String(pick(r, 'month') || '').trim();
      out.push({
        channel: channel,
        user_name: String(pick(r, 'user_name') || '').trim() || '(unassigned)',
        date: date,
        week_start: isDateKey(week) ? week : mondayOf(date),
        month: /^\d{4}-\d{2}$/.test(month) ? month : date.slice(0, 7),
        via_sequence: toBool(pick(r, 'via_sequence')),
        opened: channel === 'email' && toBool(pick(r, 'opened')),
        responded: toBool(pick(r, 'responded')),
        sequence_name: text(r, 'sequence_name'),
        template_label: text(r, 'template_label'),
        step_label: text(r, 'step_label'),
        manual_label: text(r, 'manual_label'),
        lead_key: text(r, 'lead_key').toLowerCase()
      });
    });
    return out;
  }

  /** The three AR reps first (fixed order), then anyone else alphabetically. */
  function listUsers(rows) {
    var seen = {};
    rows.forEach(function (r) { seen[r.user_name] = true; });
    var others = Object.keys(seen).filter(function (u) { return REPS.indexOf(u) < 0; }).sort();
    return REPS.concat(others);
  }

  /**
   * @param {{start?: string, end?: string, users?: string[]|null, mode?: 'all'|'sequence'|'manual'}} f
   * users null/undefined = everyone; an empty array = nobody.
   */
  function filterRows(rows, f) {
    f = f || {};
    var userSet = null;
    if (Array.isArray(f.users)) {
      userSet = {};
      f.users.forEach(function (u) { userSet[u] = true; });
    }
    var mode = f.mode || 'all';
    return rows.filter(function (r) {
      if (f.start && r.date < f.start) return false;
      if (f.end && r.date > f.end) return false;
      if (userSet && !userSet[r.user_name]) return false;
      if (mode === 'sequence' && !r.via_sequence) return false;
      if (mode === 'manual' && r.via_sequence) return false;
      return true;
    });
  }

  function ratio(num, den) {
    return den > 0 ? num / den : null;
  }

  function summarize(rows) {
    var s = { emailsSent: 0, emailsOpened: 0, emailsResponded: 0, smsSent: 0, smsResponded: 0 };
    rows.forEach(function (r) {
      if (r.channel === 'email') {
        s.emailsSent++;
        if (r.opened) s.emailsOpened++;
        if (r.responded) s.emailsResponded++;
      } else if (r.channel === 'sms') {
        s.smsSent++;
        if (r.responded) s.smsResponded++;
      }
    });
    s.totalSent = s.emailsSent + s.smsSent;
    s.totalResponded = s.emailsResponded + s.smsResponded;
    s.openRate = ratio(s.emailsOpened, s.emailsSent);
    s.responseRate = ratio(s.totalResponded, s.totalSent);
    return s;
  }

  function byUser(rows, users) {
    var groups = {};
    users.forEach(function (u) { groups[u] = []; });
    rows.forEach(function (r) { if (groups[r.user_name]) groups[r.user_name].push(r); });
    return users.map(function (u) {
      var s = summarize(groups[u]);
      s.user = u;
      return s;
    });
  }

  /* ---------- periods ---------- */

  function presetRange(preset, today) {
    switch (preset) {
      case 'last7': return { start: addDays(today, -6), end: today };
      case 'last30': return { start: addDays(today, -29), end: today };
      case 'last90': return { start: addDays(today, -89), end: today };
      case 'thisMonth': return { start: today.slice(0, 8) + '01', end: today };
      default: return { start: null, end: null };
    }
  }

  /** The period of equal length that ends the day before `start`. */
  function previousRange(start, end) {
    if (!isDateKey(start) || !isDateKey(end) || start > end) return null;
    var days = daysInclusive(start, end);
    var prevEnd = addDays(start, -1);
    return { start: addDays(prevEnd, -(days - 1)), end: prevEnd, days: days };
  }

  /**
   * kind 'count': percent change; kind 'rate': difference in percentage points.
   * Returns {dir: 'up'|'down'|'flat'|'na', label}.
   */
  function change(current, previous, kind) {
    if (kind === 'rate') {
      if (current === null || previous === null || current === undefined || previous === undefined) {
        return { dir: 'na', label: 'n/a' };
      }
      var pts = (current - previous) * 100;
      if (Math.abs(pts) < 0.05) return { dir: 'flat', label: '0.0 pts' };
      return { dir: pts > 0 ? 'up' : 'down', label: (pts > 0 ? '+' : '\u2212') + Math.abs(pts).toFixed(1) + ' pts' };
    }
    if (!previous) {
      return current ? { dir: 'up', label: 'new' } : { dir: 'flat', label: 'no change' };
    }
    var pct = (current - previous) / previous * 100;
    if (Math.abs(pct) < 0.05) return { dir: 'flat', label: '0%' };
    return { dir: pct > 0 ? 'up' : 'down', label: (pct > 0 ? '+' : '\u2212') + Math.abs(pct).toFixed(1) + '%' };
  }

  /* ---------- trend buckets ---------- */

  function bucketOf(row, grain) {
    if (grain === 'week') return row.week_start;
    if (grain === 'month') return row.month;
    return row.date;
  }

  /** Every bucket key between two dates (inclusive) so empty periods show as zero. */
  function bucketRange(start, end, grain) {
    var keys = [];
    if (!isDateKey(start) || !isDateKey(end) || start > end) return keys;
    if (grain === 'month') {
      var m = start.slice(0, 7);
      var last = end.slice(0, 7);
      while (m <= last && keys.length < MAX_BUCKETS) { keys.push(m); m = addMonths(m, 1); }
    } else if (grain === 'week') {
      var w = mondayOf(start);
      while (w <= end && keys.length < MAX_BUCKETS) { keys.push(w); w = addDays(w, 7); }
    } else {
      var d = start;
      while (d <= end && keys.length < MAX_BUCKETS) { keys.push(d); d = addDays(d, 1); }
    }
    return keys;
  }

  function emptySeries(n) {
    return {
      emailsSent: zeros(n), smsSent: zeros(n), responses: zeros(n), total: zeros(n)
    };
  }

  function zeros(n) {
    var a = new Array(n);
    for (var i = 0; i < n; i++) a[i] = 0;
    return a;
  }

  /**
   * @param {string} grain 'day' | 'week' | 'month'
   * @param {{start?: string, end?: string, users?: string[]}} opts
   *   start/end pad the axis; defaults to the first and last date present in rows.
   * @returns {{keys: string[], series: Object, byUser: Object<string, Object>}}
   */
  function trend(rows, grain, opts) {
    opts = opts || {};
    var ax = trendAxis(rows, grain, opts.start, opts.end);
    var keys = ax.keys;

    var users = opts.users || listUsers(rows);
    var series = emptySeries(keys.length);
    var perUser = {};
    users.forEach(function (u) { perUser[u] = emptySeries(keys.length); });

    rows.forEach(function (r) {
      var i = ax.index[bucketOf(r, grain)];
      addToSeries(series, i, r);
      if (perUser[r.user_name]) addToSeries(perUser[r.user_name], i, r);
    });

    return { keys: keys, series: series, byUser: perUser };
  }

  /** Sorted bucket keys covering start..end (default: the rows' own range) plus any row outside it. */
  function trendAxis(rows, grain, start, end) {
    if (!start || !end) {
      var dates = rows.map(function (r) { return r.date; }).sort();
      start = start || dates[0];
      end = end || dates[dates.length - 1];
    }
    var keys = bucketRange(start, end, grain);
    var known = {};
    keys.forEach(function (k) { known[k] = true; });
    rows.forEach(function (r) {
      var k = bucketOf(r, grain);
      if (!known[k]) { known[k] = true; keys.push(k); }
    });
    keys.sort();
    var index = {};
    keys.forEach(function (k, i) { index[k] = i; });
    return { keys: keys, index: index };
  }

  function addToSeries(t, i, r) {
    if (r.channel === 'email') t.emailsSent[i]++;
    else t.smsSent[i]++;
    if (r.responded) t.responses[i]++;
    t.total[i]++;
  }

  /* ---------- sequences ---------- */

  var SEQUENCE_FIELDS = ['sequence_name', 'template_label', 'step_label', 'manual_label', 'lead_key'];
  var MANUAL_SEQUENCE = 'Manual (no sequence)';
  var NO_STEP = 'No step or template label';
  var OTHER_MANUAL = 'Other one-off manual messages';
  var UNLABELED = 'Unlabeled';

  /**
   * Whether the Sequences tab has data to show. Unavailable when the sheet lacks any of the
   * sequence columns (server lists them in missing_columns; an older payload lacks the fields),
   * or when the columns exist but no row has been filled in yet.
   */
  function sequenceDataStatus(payload, rows) {
    var fields = (payload && payload.fields) || [];
    var reported = (payload && payload.missing_columns) || [];
    var missing = SEQUENCE_FIELDS.filter(function (f) {
      return fields.indexOf(f) < 0 || reported.indexOf(f) >= 0;
    });
    if (missing.length) return { available: false, reason: 'missing_columns', missing: missing };
    var filled = (rows || []).some(function (r) { return r.sequence_name || r.manual_label || r.lead_key; });
    if (rows && rows.length && !filled) return { available: false, reason: 'not_filled', missing: [] };
    return { available: true, reason: '', missing: [] };
  }

  /** Unique non-empty lead_key values. */
  function distinctLeads(rows) {
    var seen = {};
    var n = 0;
    rows.forEach(function (r) {
      if (r.lead_key && !seen[r.lead_key]) { seen[r.lead_key] = true; n++; }
    });
    return n;
  }

  function groupRows(rows, keyFn) {
    var order = [];
    var groups = {};
    rows.forEach(function (r) {
      var k = keyFn(r);
      if (!Object.prototype.hasOwnProperty.call(groups, k)) { groups[k] = []; order.push(k); }
      groups[k].push(r);
    });
    return order.map(function (k) { return { key: k, rows: groups[k] }; });
  }

  function summarizeGroup(name, rows) {
    var s = summarize(rows);
    s.name = name;
    s.distinctLeads = distinctLeads(rows);
    return s;
  }

  function compareName(a, b) {
    return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
  }

  function bySends(a, b) {
    return b.totalSent - a.totalSent || compareName(a, b);
  }

  function sequenceKey(row) {
    return row.sequence_name || MANUAL_SEQUENCE;
  }

  function rowsForSequence(rows, name) {
    return rows.filter(function (r) { return sequenceKey(r) === name; });
  }

  /** One summary per sequence_name (+ distinctLeads), most sends first, Manual last. */
  function bySequence(rows) {
    var list = groupRows(rows, sequenceKey).map(function (g) {
      var s = summarizeGroup(g.key, g.rows);
      s.isManual = g.key === MANUAL_SEQUENCE;
      return s;
    });
    return sortSequences(list, 'totalSent', 'desc');
  }

  /** Sorts by any summary key; empty rates sort last; the Manual row always stays last. */
  function sortSequences(groups, key, dir) {
    var sign = dir === 'asc' ? 1 : -1;
    return groups.slice().sort(function (a, b) {
      if (!!a.isManual !== !!b.isManual) return a.isManual ? 1 : -1;
      if (key === 'name') return sign * compareName(a, b);
      var va = a[key];
      var vb = b[key];
      var aNull = va === null || va === undefined;
      var bNull = vb === null || vb === undefined;
      if (aNull !== bNull) return aNull ? 1 : -1;
      if (!aNull && va !== vb) return sign * (va - vb);
      return bySends(a, b);
    });
  }

  function stepKey(row) {
    return row.step_label || row.template_label || NO_STEP;
  }

  function stepNumber(name) {
    var m = /^step\s*(\d+)/i.exec(name);
    return m ? +m[1] : null;
  }

  /** Per step_label (falling back to template_label): 'Step N' in order, then by sends, unlabeled last. */
  function byStep(rows) {
    return groupRows(rows, stepKey).map(function (g) {
      return summarizeGroup(g.key, g.rows);
    }).sort(function (a, b) {
      if ((a.name === NO_STEP) !== (b.name === NO_STEP)) return a.name === NO_STEP ? 1 : -1;
      var na = stepNumber(a.name);
      var nb = stepNumber(b.name);
      if ((na === null) !== (nb === null)) return na === null ? 1 : -1;
      if (na !== null && na !== nb) return na - nb;
      return bySends(a, b);
    });
  }

  /** Expanded-row detail for one sequence's rows: a per-rep split and the step breakdown. */
  function sequenceDetail(rows, users) {
    return {
      reps: users.map(function (u) {
        var s = summarizeGroup(u, rows.filter(function (r) { return r.user_name === u; }));
        s.user = u;
        return s;
      }),
      steps: byStep(rows)
    };
  }

  /** Names of the n real sequences (not Manual) with the most sends. */
  function topSequenceNames(groups, n) {
    return groups.filter(function (g) { return !g.isManual; })
      .slice().sort(bySends).slice(0, n)
      .map(function (g) { return g.name; });
  }

  /**
   * Like trend(), but one series per sequence name. The axis spans all `rows`.
   * @param {{start?: string, end?: string, names: string[]}} opts
   */
  function sequenceTrend(rows, grain, opts) {
    opts = opts || {};
    var ax = trendAxis(rows, grain, opts.start, opts.end);
    var names = opts.names || bySequence(rows).map(function (g) { return g.name; });
    var out = {};
    names.forEach(function (n) { out[n] = emptySeries(ax.keys.length); });
    rows.forEach(function (r) {
      var k = sequenceKey(r);
      if (Object.prototype.hasOwnProperty.call(out, k)) addToSeries(out[k], ax.index[bucketOf(r, grain)], r);
    });
    return { keys: ax.keys, bySequence: out };
  }

  function isTemplateLabel(label) {
    return /^template:/i.test(label);
  }

  /**
   * Non-sequence rows (empty sequence_name) grouped by manual_label, ranked by sends.
   * 'Template: ...' groups always count; a free-text group needs >= minLeads distinct
   * lead_keys, otherwise it is rolled into `other`. Empty labels go to `unlabeled`.
   * @param {{limit?: number, minLeads?: number}} opts  defaults 10 and 3.
   */
  function topManualMessages(rows, opts) {
    opts = opts || {};
    var limit = opts.limit || 10;
    var minLeads = opts.minLeads || 3;
    var manual = rows.filter(function (r) { return !r.sequence_name; });

    var ranked = [];
    var otherRows = [];
    var otherGroups = 0;
    var unlabeledRows = [];
    groupRows(manual, function (r) { return r.manual_label; }).forEach(function (g) {
      if (!g.key) {
        unlabeledRows = g.rows;
      } else if (isTemplateLabel(g.key) || distinctLeads(g.rows) >= minLeads) {
        ranked.push(summarizeGroup(g.key, g.rows));
      } else {
        otherRows = otherRows.concat(g.rows);
        otherGroups++;
      }
    });
    ranked.sort(bySends);

    var other = null;
    if (otherRows.length) {
      other = summarizeGroup(OTHER_MANUAL, otherRows);
      other.groupCount = otherGroups;
    }
    return {
      top: ranked.slice(0, limit),
      rankedCount: ranked.length,
      other: other,
      unlabeled: unlabeledRows.length ? summarizeGroup(UNLABELED, unlabeledRows) : null,
      manualSent: manual.length
    };
  }

  /* ---------- labels ---------- */

  function formatDateKey(key, withYear) {
    if (!isDateKey(key)) return String(key || '');
    var p = key.split('-');
    return MONTHS[+p[1] - 1] + ' ' + (+p[2]) + (withYear ? ', ' + p[0] : '');
  }

  function bucketLabel(key, grain) {
    if (grain === 'month') return MONTHS[+key.slice(5, 7) - 1] + ' ' + key.slice(0, 4);
    if (grain === 'week') return 'Wk of ' + formatDateKey(key);
    return formatDateKey(key);
  }

  function formatRange(start, end) {
    if (!start || !end) return 'All time';
    if (start === end) return formatDateKey(start, true);
    var sameYear = start.slice(0, 4) === end.slice(0, 4);
    return formatDateKey(start, !sameYear) + ' \u2013 ' + formatDateKey(end, true);
  }

  function formatInt(n) {
    return Number(n || 0).toLocaleString('en-US');
  }

  function formatPct(r) {
    return r === null || r === undefined ? '\u2014' : (r * 100).toFixed(1) + '%';
  }

  var api = {
    TIME_ZONE: TIME_ZONE,
    REPS: REPS,
    toBool: toBool,
    isDateKey: isDateKey,
    addDays: addDays,
    daysInclusive: daysInclusive,
    mondayOf: mondayOf,
    todayKey: todayKey,
    expandRows: expandRows,
    listUsers: listUsers,
    filterRows: filterRows,
    summarize: summarize,
    byUser: byUser,
    presetRange: presetRange,
    previousRange: previousRange,
    change: change,
    bucketOf: bucketOf,
    bucketRange: bucketRange,
    trend: trend,
    SEQUENCE_FIELDS: SEQUENCE_FIELDS,
    MANUAL_SEQUENCE: MANUAL_SEQUENCE,
    NO_STEP: NO_STEP,
    OTHER_MANUAL: OTHER_MANUAL,
    UNLABELED: UNLABELED,
    sequenceDataStatus: sequenceDataStatus,
    distinctLeads: distinctLeads,
    bySequence: bySequence,
    sortSequences: sortSequences,
    rowsForSequence: rowsForSequence,
    byStep: byStep,
    sequenceDetail: sequenceDetail,
    topSequenceNames: topSequenceNames,
    sequenceTrend: sequenceTrend,
    topManualMessages: topManualMessages,
    bucketLabel: bucketLabel,
    formatDateKey: formatDateKey,
    formatRange: formatRange,
    formatInt: formatInt,
    formatPct: formatPct
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();
</script>
